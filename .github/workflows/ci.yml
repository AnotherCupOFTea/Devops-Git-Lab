name: Infrastructure CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: pip install PyYAML

      - name: Validate YAML files
        run: |
          python -c "import pathlib, yaml; files = list(pathlib.Path('.').rglob('*.yml')) + list(pathlib.Path('.').rglob('*.yaml')); [yaml.safe_load(p.read_text(encoding='utf-8')) for p in files if '.git' not in p.parts]; print('YAML validation passed')"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Build Docker image
        run: docker build -t infrastructure-app -f docker/Dockerfile .